<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语流 VoiceFlow Builder — Operations Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter','Noto Sans SC',sans-serif;background:#f8f9fa;color:#1e293b;display:flex;min-height:100vh;}
.sidebar{width:240px;background:#1a1a2e;color:#e2e8f0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;}
.sidebar-logo{padding:20px 24px;font-size:18px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;}
.sidebar-logo .logo-icon{width:32px;height:32px;background:#4f46e5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto;}
.nav-group-label{padding:8px 24px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 24px;color:#cbd5e1;text-decoration:none;font-size:14px;transition:all .15s;cursor:pointer;border-left:3px solid transparent;}
.nav-item:hover{background:rgba(79,70,229,.1);color:#e2e8f0;}
.nav-item.active{background:rgba(79,70,229,.15);color:#fff;border-left-color:#4f46e5;}
.nav-item .icon{width:20px;text-align:center;font-size:16px;}
.main{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:16px;font-weight:600;}
.topbar-actions{display:flex;align-items:center;gap:12px;}
.lang-btn{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:500;color:#475569;}
.time-tabs{display:flex;gap:4px;background:#f1f5f9;border-radius:8px;padding:3px;}
.time-tab{padding:5px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;color:#64748b;border:none;background:none;}
.time-tab.active{background:#fff;color:#1e293b;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.content{flex:1;padding:32px;}
/* KPI cards */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
.kpi-card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:20px 24px;}
.kpi-label{font-size:13px;color:#94a3b8;font-weight:500;margin-bottom:6px;}
.kpi-value{font-size:30px;font-weight:700;color:#1e293b;}
.kpi-change{font-size:12px;margin-top:4px;}
.kpi-change.up{color:#22c55e;}
.kpi-change.down{color:#ef4444;}
/* Chart area */
.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-bottom:28px;}
.chart-grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:28px;}
.panel{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;}
.panel-header{padding:16px 24px;border-bottom:1px solid #e2e8f0;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;}
.panel-body{padding:20px 24px;}
/* SVG chart */
.chart-container{width:100%;height:220px;}
/* Heatmap */
.heatmap-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.heatmap-cell{border-radius:8px;padding:14px;text-align:center;color:#fff;font-weight:600;font-size:13px;}
.heatmap-cell .node-name{font-size:12px;opacity:.85;margin-top:2px;}
.heat-green{background:#22c55e;}
.heat-yellow{background:#f59e0b;}
.heat-red{background:#ef4444;}
/* Funnel */
.funnel-bar{display:flex;align-items:center;margin-bottom:8px;gap:12px;}
.funnel-label{width:90px;font-size:13px;color:#64748b;text-align:right;}
.funnel-track{flex:1;height:32px;background:#f1f5f9;border-radius:6px;overflow:hidden;position:relative;}
.funnel-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding:0 12px;color:#fff;font-size:12px;font-weight:600;transition:width .5s;}
.funnel-value{font-size:13px;font-weight:600;width:60px;text-align:right;color:#475569;}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo"><div class="logo-icon">VF</div><span data-i18n="brand">语流 VoiceFlow</span></div>
  <div class="sidebar-nav">
    <div class="nav-group-label" data-i18n="nav_design">设计</div>
    <a class="nav-item" href="canvas.html"><span class="icon">🎨</span><span data-i18n="nav_canvas">流程画布</span></a>
    <a class="nav-item" href="node-config.html"><span class="icon">🧩</span><span data-i18n="nav_nodes">节点配置</span></a>
    <a class="nav-item" href="version.html"><span class="icon">📋</span><span data-i18n="nav_version">版本管理</span></a>
    <div class="nav-group-label" data-i18n="nav_ops">运营</div>
    <a class="nav-item" href="runtime.html"><span class="icon">⚡</span><span data-i18n="nav_runtime">运行管理</span></a>
    <a class="nav-item active" href="dashboard.html"><span class="icon">📊</span><span data-i18n="nav_dashboard">运营看板</span></a>
    <a class="nav-item" href="simulation.html"><span class="icon">🧪</span><span data-i18n="nav_simulation">模拟测试</span></a>
    <div class="nav-group-label" data-i18n="nav_telecom">通信</div>
    <a class="nav-item" href="telephony.html"><span class="icon">📞</span><span data-i18n="nav_telephony">通信设置</span></a>
    <a class="nav-item" href="numbers.html"><span class="icon">🔢</span><span data-i18n="nav_numbers">号码管理</span></a>
  </div>
</nav>
<div class="main">
  <div class="topbar">
    <div class="topbar-title" data-i18n="page_title">运营看板</div>
    <div class="topbar-actions">
      <div class="time-tabs">
        <button class="time-tab" onclick="setRange(this,7)" data-i18n="days7">7天</button>
        <button class="time-tab active" onclick="setRange(this,30)" data-i18n="days30">30天</button>
        <button class="time-tab" onclick="setRange(this,90)" data-i18n="days90">90天</button>
      </div>
      <button class="lang-btn" onclick="toggleLang()" id="langBtn">EN</button>
    </div>
  </div>
  <div class="content">
    <!-- KPI -->
    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label" data-i18n="kpi_total">总通话量</div><div class="kpi-value">12,847</div><div class="kpi-change up">+8.3%</div></div>
      <div class="kpi-card"><div class="kpi-label" data-i18n="kpi_answer">接通率</div><div class="kpi-value">94.2%</div><div class="kpi-change up">+1.5%</div></div>
      <div class="kpi-card"><div class="kpi-label" data-i18n="kpi_duration">平均时长</div><div class="kpi-value">2m 34s</div><div class="kpi-change down">-12s</div></div>
      <div class="kpi-card"><div class="kpi-label" data-i18n="kpi_satisfaction">满意度</div><div class="kpi-value">4.6</div><div class="kpi-change up">+0.2</div></div>
    </div>
    <!-- Trend + Heatmap -->
    <div class="chart-grid">
      <div class="panel">
        <div class="panel-header"><span data-i18n="trend_title">通话量趋势</span></div>
        <div class="panel-body"><div class="chart-container" id="trendChart"></div></div>
      </div>
      <div class="panel">
        <div class="panel-header"><span data-i18n="heatmap_title">节点通过率热力图</span></div>
        <div class="panel-body">
          <div class="heatmap-grid" id="heatmapGrid"></div>
        </div>
      </div>
    </div>
    <!-- Funnel + Exception -->
    <div class="chart-grid2">
      <div class="panel">
        <div class="panel-header"><span data-i18n="funnel_title">转化漏斗</span></div>
        <div class="panel-body" id="funnelBody"></div>
      </div>
      <div class="panel">
        <div class="panel-header"><span data-i18n="exception_title">异常与异常率</span></div>
        <div class="panel-body">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
            <div style="text-align:center;padding:16px;background:#fef2f2;border-radius:8px;">
              <div style="font-size:28px;font-weight:700;color:#ef4444;">1.2%</div>
              <div style="font-size:12px;color:#94a3b8;margin-top:4px;" data-i18n="exception_rate">异常率</div>
            </div>
            <div style="text-align:center;padding:16px;background:#fffbeb;border-radius:8px;">
              <div style="font-size:28px;font-weight:700;color:#f59e0b;">154</div>
              <div style="font-size:12px;color:#94a3b8;margin-top:4px;" data-i18n="anomaly_count">异常数</div>
            </div>
          </div>
          <div style="font-size:13px;color:#475569;">
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;"><span data-i18n="exc_timeout">超时断开</span><span style="font-weight:600;">89</span></div>
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;"><span data-i18n="exc_asr_fail">识别失败</span><span style="font-weight:600;">42</span></div>
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;"><span data-i18n="exc_transfer_fail">转接失败</span><span style="font-weight:600;">23</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const i18n={zh:{brand:"语流 VoiceFlow",nav_design:"设计",nav_ops:"运营",nav_telecom:"通信",nav_canvas:"流程画布",nav_nodes:"节点配置",nav_version:"版本管理",nav_runtime:"运行管理",nav_dashboard:"运营看板",nav_simulation:"模拟测试",nav_telephony:"通信设置",nav_numbers:"号码管理",page_title:"运营看板",days7:"7天",days30:"30天",days90:"90天",kpi_total:"总通话量",kpi_answer:"接通率",kpi_duration:"平均时长",kpi_satisfaction:"满意度",trend_title:"通话量趋势",heatmap_title:"节点通过率热力图",funnel_title:"转化漏斗",exception_title:"异常与异常率",exception_rate:"异常率",anomaly_count:"异常数",exc_timeout:"超时断开",exc_asr_fail:"识别失败",exc_transfer_fail:"转接失败"},en:{brand:"VoiceFlow",nav_design:"Design",nav_ops:"Operations",nav_telecom:"Telecom",nav_canvas:"Flow Canvas",nav_nodes:"Node Config",nav_version:"Versions",nav_runtime:"Runtime",nav_dashboard:"Dashboard",nav_simulation:"Simulation",nav_telephony:"Telephony",nav_numbers:"Numbers",page_title:"Operations Dashboard",days7:"7 Days",days30:"30 Days",days90:"90 Days",kpi_total:"Total Calls",kpi_answer:"Answer Rate",kpi_duration:"Avg Duration",kpi_satisfaction:"Satisfaction",trend_title:"Call Volume Trend",heatmap_title:"Node Pass Rate Heatmap",funnel_title:"Conversion Funnel",exception_title:"Exceptions & Anomaly",exception_rate:"Exception Rate",anomaly_count:"Anomaly Count",exc_timeout:"Timeout",exc_asr_fail:"ASR Failure",exc_transfer_fail:"Transfer Failure"}};
let lang='zh';
function toggleLang(){lang=lang==='zh'?'en':'zh';document.getElementById('langBtn').textContent=lang==='zh'?'EN':'中';document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(i18n[lang][k])el.textContent=i18n[lang][k];});renderAll();}
function setRange(el,d){document.querySelectorAll('.time-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderTrend();}

const trendData30=[320,410,380,450,520,480,560,610,590,630,680,720,690,710,750,780,740,800,820,790,850,870,830,900,880,920,950,910,960,980];
const heatmapNodes=[
  {name:lang=>'欢迎语',rate:97},{name:lang=>'IVR菜单',rate:92},{name:lang=>'语音识别',rate:78},{name:lang=>'转人工',rate:85},
  {name:lang=>'留言',rate:95},{name:lang=>'查询',rate:71},{name:lang=>'预约',rate:88},{name:lang=>'投诉',rate:65}
];
const funnelSteps=[
  {label:lang=>lang==='zh'?'来电接入':'Inbound',value:12847,color:'#4f46e5'},
  {label:lang=>lang==='zh'?'IVR导航':'IVR Nav',value:11200,color:'#6366f1'},
  {label:lang=>lang==='业务处理':'Processing',value:8900,color:'#818cf8'},
  {label:lang=>lang?'成功解决':'Resolved',value:7600,color:'#a5b4fc'},
  {label:lang=>lang==='zh'?'客户满意':'Satisfied',value:6200,color:'#c7d2fe'}
];

function renderTrend(){
  const data=trendData30;
  const w=700,h=200,pad=40;
  const max=Math.max(...data)*1.1;
  const pts=data.map((v,i)=>`${pad+i*(w-pad*2)/(data.length-1)},${h-pad-(v/max)*(h-pad*2)}`);
  const svg=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" style="overflow:visible">
    <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4f46e5" stop-opacity="0.2"/><stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${pad},${h-pad} ${pts.join(' ')} ${w-pad},${h-pad}" fill="url(#areaGrad)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${data.map((v,i)=>`<circle cx="${pad+i*(w-pad*2)/(data.length-1)}" cy="${h-pad-(v/max)*(h-pad*2)}" r="3" fill="#4f46e5" stroke="#fff" stroke-width="1.5"/>`).join('')}
  </svg>`;
  document.getElementById('trendChart').innerHTML=svg;
}

function renderHeatmap(){
  document.getElementById('heatmapGrid').innerHTML=heatmapNodes.map(n=>{
    const cls=n.rate>=90?'heat-green':n.rate>=70?'heat-yellow':'heat-red';
    return `<div class="heatmap-cell ${cls}"><div>${n.rate}%</div><div class="node-name">${n.name(lang)}</div></div>`;
  }).join('');
}

function renderFunnel(){
  const maxVal=funnelSteps[0].value;
  document.getElementById('funnelBody').innerHTML=funnelSteps.map(s=>`
    <div class="funnel-bar">
      <div class="funnel-label">${s.label(lang)}</div>
      <div class="funnel-track"><div class="funnel-fill" style="width:${(s.value/maxVal*100)}%;background:${s.color}">${s.value.toLocaleString()}</div></div>
    </div>
  `).join('');
}

function renderAll(){renderTrend();renderHeatmap();renderFunnel();}
renderAll();
</script>
</body>
</html>
