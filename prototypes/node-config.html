*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter','Noto Sans SC',sans-serif;background:#f8f9fa;color:#1e293b;display:flex;min-height:100vh;}
.sidebar{width:240px;background:#1a1a2e;color:#e2e8f0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;}

.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto;}
.nav-group-label{padding:8px 24px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 24px;color:#cbd5e1;text-decoration:none;font-size:14px;transition:all .15s;cursor:pointer;border-left:3px solid transparent;}
.nav-item:hover{background:rgba(79,70,229,.1);color:#e2e8f0;}
.nav-item.active{background:rgba(79,70,229,.15);color:#fff;border-left-color:#4f46e5;}
.nav-item .icon{width:20px;text-align:center;font-size:16px;}
.main{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:16px;font-weight:600;}
.topbar-actions{display:flex;align-items:center;gap:12px;}
.lang-btn{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:500;color:#475569;}
.content{flex:1;padding:32px;}
/* Node cards grid */
.node-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:24px;}
.node-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;cursor:pointer;transition:all .15s;text-align:center;}
.node-card:hover{border-color:#4f46e5;box-shadow:0 2px 8px rgba(79,70,229,.08);transform:translateY(-1px);}
.node-card.selected{border-color:#4f46e5;background:#eef2ff;}
.node-card .nc-icon{font-size:28px;margin-bottom:8px;}
.node-card .nc-name{font-size:13px;font-weight:600;color:#1e293b;}
.node-card .nc-type{font-size:11px;color:#94a3b8;margin-top:2px;}
/* Config panel */
.config-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.config-panel{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;}
.config-header{padding:16px 24px;border-bottom:1px solid #e2e8f0;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;}
.config-body{padding:24px;max-height:calc(100vh - 260px);overflow-y:auto;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:13px;font-weight:500;color:#475569;margin-bottom:6px;}
.form-group label .required{color:#ef4444;margin-left:2px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;font-family:inherit;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1);}
.form-group textarea{min-height:80px;resize:vertical;}
.form-group .error{border-color:#ef4444 !important;}
.form-group .error-msg{font-size:12px;color:#ef4444;margin-top:4px;display:none;}
.form-group .error-msg.show{display:block;}
.form-row{display:flex;gap:16px;}
.form-row .form-group{flex:1;}
.btn-primary{background:#4f46e5;color:#fff;border:none;border-radius:6px;padding:9px 20px;font-size:13px;cursor:pointer;font-weight:500;}
.btn-primary:hover{background:#4338ca;}
.btn-outline{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:9px 20px;font-size:13px;cursor:pointer;font-weight:500;color:#475569;}
.btn-validate{background:#f59e0b;color:#fff;border:none;border-radius:6px;padding:9px 20px;font-size:13px;cursor:pointer;font-weight:500;}
/* Preview panel */
.preview-section{margin-top:16px;}
.preview-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:20px;}
.preview-header{font-size:14px;font-weight:600;margin-bottom:12px;color:#475569;}
.preview-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.preview-node{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;font-size:13px;text-align:center;min-width:80px;}
.preview-node.active{border-color:#4f46e5;background:#eef2ff;color:#4338ca;font-weight:600;}
.preview-node .pn-label{font-size:11px;color:#94a3b8;margin-bottom:2px;}
.preview-arrow{color:#94a3b8;font-size:16px;}

.call-preview{background:#1e293b;border-radius:10px;padding:20px;margin-top:16px;color:#e2e8f0;}
.call-preview .cp-label{font-size:11px;color:#94a3b8;margin-bottom:4px;}
.call-preview .cp-msg{font-size:14px;line-height:1.6;margin-bottom:12px;}
.call-preview .cp-msg.sys{color:#a5b4fc;}
.call-preview .cp-msg.usr{color:#86efac;text-align:right;}
.call-preview .cp-msg.err{color:#fca5a5;}
</style>
</head>

  loop:[{key:'name',label:'节点名称',labelEn:'Node Name',type:'text',required:true,placeholder:'如：循环',placeholderEn:'e.g. Loop'},
        {key:'maxIterations',label:'最大循环次数',labelEn:'Max Iterations',type:'number',required:true,placeholder:'3',placeholderEn:'3'},
        {key:'exitCondition',label:'退出条件',labelEn:'Exit Condition',type:'text',required:true,placeholder:'${resolved} == true',placeholderEn:'${resolved} == true'}],
  subflow:[{key:'name',label:'节点名称',labelEn:'Node Name',type:'text',required:true,placeholder:'如：子流程',placeholderEn:'e.g. Sub Flow'},
           {key:'flowId',label:'子流程ID',labelEn:'Flow ID',type:'text',required:true,placeholder:'flow售后处理',placeholderEn:'flow-support'},
           {key:'passVars',label:'传入变量',labelEn:'Pass Variables',type:'textarea',required:false,placeholder:'{"order_id":"${order_id}"}',placeholderEn:'{"order_id":"${order_id}"}'}],
  record:[{key:'name',label:'节点名称',labelEn:'Node Name',type:'text',required:true,placeholder:'如：录音',placeholderEn:'e.g. Record'},
          {key:'duration',label:'录音时长(秒)',labelEn:'Duration(s)',type:'number',required:true,placeholder:'30',placeholderEn:'30'},
          {key:'beep',label:'提示音',labelEn:'Beep',type:'select',required:false,options:['播放','不播放'],optionsEn:['Play','None']},
          {key:'format',label:'录音格式',labelEn:'Format',type:'select',required:false,options:['WAV','MP3','OGG'],optionsEn:['WAV','MP3','OGG']}]
};

let selectedNode=null;

function toggleLang(){lang=lang==='zh'?'en':'zh';document.getElementById('langBtn').textContent=lang==='zh'?'EN':'中';document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(i18n[lang][k])el.textContent=i18n[lang][k];});renderGrid();if(selectedNode)renderConfig(selectedNode);}

function renderGrid(){
  document.getElementById('nodeGrid').innerHTML=nodeTypes.map(n=>`
    <div class="node-card ${selectedNode===n.id?'selected':''}" onclick="selectNode('${n.id}')">
      <div class="nc-icon">${n.icon}</div>
      <div class="nc-name">${lang==='zh'?n.name:n.nameEn}</div>
      <div class="nc-type">${n.category}</div>
    </div>`).join('');
}

function selectNode(id){
  selectedNode=id;
  renderGrid();
  renderConfig(id);
}

function renderConfig(id){
  document.getElementById('configArea').style.display='grid';
  const nt=nodeTypes.find(n=>n.id===id);
  const fields=nodeFields[id]||[];
  document.getElementById('configTitle').textContent=lang==='zh'?nt.name:nt.nameEn;

  let html='';
  fields.forEach(f=>{
    const isReq=f.required;
    const lbl=lang==='zh'?f.label:f.labelEn;
    const ph=lang==='zh'?f.placeholder:f.placeholderEn;
    const reqMark=isReq?'<span class="required">*</span>':'';
    if(f.type==='textarea'){
      html+=`<div class="form-group"><label>${lbl}${reqMark}</label><textarea id="field_${f.key}" placeholder="${ph||''}" data-required="${isReq}"></textarea><div class="error-msg" id="err_${f.key}">${i18n[lang].field_required}</div></div>`;
    }else if(f.type==='select'){
      const opts=(lang==='en'&&f.optionsEn)?f.optionsEn:f.options;
      html+=`<div class="form-group"><label>${lbl}${reqMark}</label><select id="field_${f.key}" data-required="${isReq}">${opts.map(o=>`<option>${o}</option>`).join('')}</select><div class="error-msg" id="err_${f.key}">${i18n[lang].field_required}</div></div>`;
    }else{
      html+=`<div class="form-group"><label>${lbl}${reqMark}</label><input type="${f.type}" id="field_${f.key}" placeholder="${ph||''}" data-required="${isReq}"><div class="error-msg" id="err_${f.key}">${i18n[lang].field_required}</div></div>`;
    }
  });
  document.getElementById('configBody').innerHTML=html;
  renderPreview(id);
}

function renderPreview(id){
  const nt=nodeTypes.find(n=>n.id===id);
  // Flow preview
  const flowSteps=[
    {label:'开始',active:false},{label:'欢迎语',active:false},
    {label:lang==='zh'?nt.name:nt.nameEn,active:true},
    {label:'条件判断',active:false},{label:'结束',active:false}
  ];
  document.getElementById('previewFlow').innerHTML=flowSteps.map((s,i)=>`
    ${i>0?'<span class="preview-arrow">→</span>':''}
    <div class="preview-node ${s.active?'active':''}"><div class="pn-label">${s.label}</div></div>
  `).join('');

  // Call preview
  const previews={
    greeting:'<div class="cp-msg sys">[系统] 您好，欢迎致电语流科技，请问有什么可以帮您？</div><div class="cp-msg usr">[用户] 我想咨询一下</div>',
    ivr_menu:'<div class="cp-msg sys">[系统] 按1进入售前咨询，按2进入售后服务，按3转人工</div><div class="cp-msg usr">[用户] 按2</div><div class="cp-msg sys">[系统] 好的，正在为您转接售后服务...</div>',
    asr:'<div class="cp-msg sys">[系统] 请说出您的需求</div><div class="cp-msg usr">[用户] 我想退货</div><div class="cp-msg sys">[系统] 识别结果：退货</div>',
    keyword:'<div class="cp-msg sys">[系统] 正在分析您的输入...</div><div class="cp-msg sys">[系统] 匹配到关键词"退货"，跳转退货流程</div>',
    transfer:'<div class="cp-msg sys">[系统] 正在为您转接人工客服，请稍候...</div><div class="cp-msg sys">[系统] 播放等待音乐 ♪</div><div class="cp-msg sys">[系统] 已接通，客服-小王为您服务</div>',
    end:'<div class="cp-msg sys">[系统] 感谢您的来电，再见！</div><div class="cp-msg usr">[用户] 挂断</div>'
  };
  const preview=previews[id]||`<div class="cp-msg sys">[系统] ${lang==='zh'?nt.name:nt.nameEn}节点执行中...</div>`;
  document.getElementById('callPreview').innerHTML=`<div class="cp-label">${i18n[lang].call_sim}</div>${preview}`;
}

function validateForm(){
  let valid=true;
  document.querySelectorAll('#configBody [data-required="true"]').forEach(el=>{
    const key=el.id.replace('field_','');
    const errEl=document.getElementById('err_'+key);
    if(!el.value.trim()){
      el.classList.add('error');
      errEl.classList.add('show');
      valid=false;
    }else{
      el.classList.remove('error');
      errEl.classList.remove('show');
    }
  });
  if(!valid){
    // Show error state in call preview
    document.getElementById('callPreview').innerHTML+=`<div class="cp-msg err">[错误] ${i18n[lang].validation_failed}</div>`;
  }
  alert(valid?i18n[lang].validation_passed:i18n[lang].validation_failed);
}

function saveNode(){alert(i18n[lang].node_saved);}
function resetForm(){if(selectedNode)renderConfig(selectedNode);}

renderGrid();
</script>
</body>
</html>
